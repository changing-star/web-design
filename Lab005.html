<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Bar Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen bg-white">
        <!-- Main Content -->
        <div id="mainContent" class="flex-1 flex flex-col items-center justify-center relative transition-all duration-300">
            <!-- Hamburger Menu Button -->
            <button id="menuBtn" class="absolute top-6 right-6 text-blue-400 hover:text-blue-600 z-20" aria-label="Toggle menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

        </div>

        <!-- Overlay (for when sidebar is open) -->
        <div id="overlay" class="fixed inset-0 bg-black opacity-0 transition-opacity duration-300 pointer-events-none z-10"></div>

        <!-- Sidebar -->
        <div id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-gray-50 shadow-lg transform -translate-x-full transition-transform duration-300 z-30 flex flex-col">
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800">SIDE-BAR</h2>
                <button id="closeBtn" class="text-red-500 hover:text-red-700 text-2xl" aria-label="Close sidebar">
                    ×
                </button>
            </div>

            <!-- Navigation Menu -->
            <nav class="flex-1 px-6 py-8">
                <ul class="space-y-6">
                    <li>
                        <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors text-lg">
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors text-lg">
                            About
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors text-lg">
                            Projects
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors text-lg">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Social Media Icons -->
            <div class="px-6 py-8 border-t border-gray-200 flex justify-center gap-4">
                <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors" title="Facebook">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>
                <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors" title="Twitter">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2s9 5 20 5a9.5 9.5 0 00-9-5.5c4.75 2.25 7-7 7-7a10.6 10.6 0 01-9.5 5"/>
                    </svg>
                </a>
                <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors" title="LinkedIn">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
                    </svg>
                </a>
                <a href="#" class="text-blue-400 hover:text-blue-600 transition-colors" title="Heart">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const mainContent = document.getElementById('mainContent');

        // Open sidebar
        menuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-50');
        });

        // Close sidebar
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-50');
        }

        // Close sidebar on menu item click
        document.querySelectorAll('#sidebar a').forEach(link => {
            link.addEventListener('click', closeSidebar);
        });
    </script>
</body>
</html>
