<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-600 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg overflow-hidden">
        <!-- Post Header -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <!-- Avatar -->
                    <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    <div>
                        <h3 class="font-bold text-blue-600 text-sm">Friend Name</h3>
                        <p class="text-xs text-gray-600">Today at 19:33 • 🌐</p>
                    </div>
                </div>
                <!-- Menu Icon -->
                <button class="text-gray-600 hover:text-gray-900">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="5" r="2"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                        <circle cx="12" cy="19" r="2"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Post Content -->
        <div class="px-4 pt-4 pb-3">
            <p class="text-gray-800 text-sm mb-2">
                I want this mockup so bad!!<br>
                <span class="text-gray-600">Found it at </span><a href="#" class="text-blue-500 hover:underline text-sm">http://marinad.com.ar</a>
            </p>
            <a href="#" class="text-blue-500 hover:underline text-sm font-semibold">See translation</a>
        </div>

        <!-- Image Placeholder -->
        <div class="bg-blue-500 h-64 mx-4 mb-4 rounded"></div>

        <!-- Action Buttons -->
        <div class="flex border-t border-gray-200 divide-x divide-gray-200">
            <button class="flex-1 py-2 text-center text-gray-600 hover:bg-gray-100 text-sm font-semibold flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h-2m2 0h2m-2 0v2m0-2v-2m0 4H8m6-6H8m0 0v2m0-2v-2"></path>
                </svg>
                Like
            </button>
            <button class="flex-1 py-2 text-center text-gray-600 hover:bg-gray-100 text-sm font-semibold flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                Comment
            </button>
            <button class="flex-1 py-2 text-center text-gray-600 hover:bg-gray-100 text-sm font-semibold flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C9.589 12.430 10.647 12 11.724 12h.015m0 0h.015m0 0v1.5m0-1.5v-1.5M17.316 13.342c.905.908 1.5 2.050 1.5 3.158 0 4.418-4.03 8-9 8-1.077 0-2.135-.43-3.040-1.342m6.232-8v-1.5"></path>
                </svg>
                Share
            </button>
        </div>

        <!-- Reactions -->
        <div class="px-4 py-2 border-t border-gray-200 flex items-center gap-1">
            <div class="flex -space-x-2">
                <span class="text-lg">👍</span>
                <span class="text-lg">❤️</span>
                <span class="text-lg">😂</span>
            </div>
            <span class="text-xs text-gray-600 ml-2">1,035</span>
        </div>

        <!-- Comment Input -->
        <div class="px-4 py-3 border-t border-gray-200 flex items-center gap-3">
            <!-- User Avatar -->
            <div class="w-8 h-8 bg-gray-300 rounded-full flex-shrink-0"></div>
            <!-- Input Field -->
            <div class="flex-1 bg-gray-100 rounded-full px-4 py-2 flex items-center gap-2">
                <input type="text" placeholder="Write something..." class="bg-transparent text-sm flex-1 outline-none placeholder-gray-500">
                <button class="text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                    </svg>
                </button>
            </div>
            <!-- Action Icons -->
            <div class="flex gap-2">
                <button class="text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"></path>
                    </svg>
                </button>
                <button class="text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
                    </svg>
                </button>
                <button class="text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"></path>
                    </svg>
                </button>
                <button class="text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M15 11H7.71L9.16 9.55c.63-.63.17-1.71-.71-1.71H5c-.55 0-1 .45-1 1v3.59c0 .89 1.08 1.34 1.71.71l1.44-1.44V13c0 1.1.9 2 2 2s2-.9 2-2h1.9c0 2.71-2.37 4.9-5.3 4.9-.55 0-1 .45-1 1s.45 1 1 1c4.01 0 7.3-3.29 7.3-7.3zm5.3-6c-.55 0-1 .45-1 1v2.59L17.86 5.14c-.63-.63-1.71-.17-1.71.71V9c0 .55.45 1 1 1h3.59c.89 0 1.34-1.08.71-1.71L18.71 5.71V4c0-.55-.45-1-1-1z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
